name: "Minha Primeira Esteira"

on:
  push:
    branches: 
      - main

jobs:
  build:
    name: Build, Package & Dockerize application
    runs-on: ubuntu-latest
    
    # Permissões necessárias para publicar imagens no GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
    # Step 1: Baixa o código do repositório
    - name: Checkout source code
      uses: actions/checkout@v4

    # Step 2: Configura o ambiente Java (JDK) e cache
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # Step 3: Permissão de execução para o maven wrapper
    - name: Grant execute permission for maven wrapper
      run: chmod +x mvnw

    # Step 4: Compila o código e gera o arquivo .jar
    - name: Build with Maven (Compile, Test and Package)
      run: ./mvnw clean package

    # Step 5: Faz o login automático no GitHub Container Registry (GHCR)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Step 6: Constrói a imagem Docker e envia para o registro do GitHub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Define a tag da imagem usando o nome do repositório em letras minúsculas
        tags: |
          ghcr.io/${{ github.repository_owner }}/springboot-app:latest
          ghcr.io/${{ github.repository_owner }}/springboot-app:${{ github.sha }}

